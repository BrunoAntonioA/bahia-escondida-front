<div class="min-h-screen bg-gray-50/50 overflow-x-hidden">
  @if (sidebarOpen) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-black/50 lg:hidden"
      aria-label="Cerrar menú"
      (click)="closeSidebar()"
    ></button>
  }

  <app-sidebar
    [open]="sidebarOpen"
    (closed)="closeSidebar()"
    (navigated)="closeSidebar()"
  />

  <div class="min-h-screen p-4 lg:ml-72">
    <nav
      class="block w-full max-w-full bg-transparent shadow-none rounded-xl transition-all px-0 py-1"
    >
      <app-header (menuClick)="openSidebar()" />
    </nav>

    <div class="mt-4 lg:mt-8">
      <router-outlet />
    </div>

    <div class="text-blue-gray-600 mt-8">
      <app-footer />
    </div>
  </div>
</div>
