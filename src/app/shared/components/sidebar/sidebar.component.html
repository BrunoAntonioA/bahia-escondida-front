<aside
  class="bg-gradient-to-br from-gray-800 to-gray-900 fixed inset-y-0 left-0 z-50 flex h-full w-[min(18rem,85vw)] flex-col overflow-hidden transition-transform duration-300 ease-in-out -translate-x-full pointer-events-none lg:translate-x-0 lg:inset-y-0 lg:left-0 lg:m-4 lg:h-[calc(100vh-32px)] lg:w-72 lg:max-w-[calc(100vw-2rem)] lg:rounded-xl lg:pointer-events-auto"
  [class.translate-x-0]="open"
  [class.pointer-events-auto]="open"
>
  <div class="relative shrink-0 border-b border-white/20">
    <a class="flex items-center gap-4 py-6 px-8 min-w-0" href="#/">
      <div class="min-w-0">
        <h6
          class="block antialiased tracking-normal font-sans text-base font-semibold leading-snug text-white truncate"
          [title]="authService.getClientName() || 'Mi negocio'"
        >
          {{ authService.getClientName() || 'Mi negocio' }}
        </h6>
        <p class="text-xs text-white/60 mt-0.5 truncate">
          Panel de gestión
        </p>
      </div>
    </a>
    <button
      class="middle none font-sans font-medium text-center uppercase transition-all disabled:opacity-50 disabled:shadow-none disabled:pointer-events-none w-8 max-w-[32px] h-8 max-h-[32px] rounded-lg text-xs text-white hover:bg-white/10 active:bg-white/30 absolute right-0 top-0 grid rounded-br-none rounded-tl-none lg:hidden"
      type="button" aria-label="Cerrar menú" (click)="onClose()">
      <span class="absolute top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
          aria-hidden="true" class="h-5 w-5 text-white">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </span>
    </button>
  </div>

  <div class="flex min-h-0 flex-1 flex-col px-4 pt-4 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
    <ul class="mb-4 flex min-h-0 flex-1 flex-col gap-1 overflow-y-auto">
      <li>
        <a routerLink="/inicio" (click)="onNavigate()">
          <button routerLinkActive="bg-gradient-to-tr from-blue-600 to-blue-400 shadow-md shadow-blue-500/20"
            class="middle none font-sans font-bold center transition-all disabled:opacity-50 disabled:shadow-none disabled:pointer-events-none text-xs py-3 rounded-lg text-white hover:bg-white/10 active:bg-white/30 w-full flex items-center gap-4 px-4 capitalize"
            type="button">
            <!-- Home icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
              class="w-5 h-5 text-inherit">
              <path fill-rule="evenodd"
                d="M10.707 2.293a1 1 0 011.414 0l8 8a1 1 0 01-1.414 1.414L18 10.414V20a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4H12v4a1 1 0 01-1 1H7a1 1 0 01-1-1v-9.586l-.707.707A1 1 0 014.879 9.879l5.828-5.828z"
                clip-rule="evenodd" />
            </svg>

            <p class="block antialiased font-sans text-base leading-relaxed text-inherit font-medium capitalize">
              Inicio
            </p>
          </button>
        </a>
      </li>
      <li>
        <a routerLink="/ventas" (click)="onNavigate()">
          <button routerLinkActive="bg-gradient-to-tr from-blue-600 to-blue-400 shadow-md shadow-blue-500/20"
            class="middle none font-sans font-bold center transition-all disabled:opacity-50 disabled:shadow-none disabled:pointer-events-none text-xs py-3 rounded-lg text-white hover:bg-white/10 active:bg-white/30 w-full flex items-center gap-4 px-4 capitalize"
            type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
              class="w-5 h-5 text-inherit">
              <!-- Table top -->
              <rect x="4" y="8" width="16" height="3" rx="1"></rect>
              <!-- Left leg -->
              <rect x="6" y="11" width="2" height="6" rx="1"></rect>
              <!-- Right leg -->
              <rect x="16" y="11" width="2" height="6" rx="1"></rect>
            </svg>

            <p class="block antialiased font-sans text-base leading-relaxed text-inherit font-medium capitalize">
              Ventas
            </p>
          </button>
        </a>
      </li>
      <li>
        <a routerLink="/delivery" (click)="onNavigate()">
          <button routerLinkActive="bg-gradient-to-tr from-blue-600 to-blue-400 shadow-md shadow-blue-500/20"
            class="middle none font-sans font-bold center transition-all disabled:opacity-50 disabled:shadow-none disabled:pointer-events-none text-xs py-3 rounded-lg text-white hover:bg-white/10 active:bg-white/30 w-full flex items-center gap-4 px-4 capitalize"
            type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
              class="w-5 h-5 text-inherit">
              <path d="M5 16a3 3 0 116 0 3 3 0 01-6 0zm8 0a3 3 0 116 0 3 3 0 01-6 0zM7 13h6l2-4h-4l-1-2H6v2h2l-1 2z" />
            </svg>

            <p class="block antialiased font-sans text-base leading-relaxed text-inherit font-medium capitalize">
              Delivery
            </p>
          </button>
        </a>
      </li>
      <li>
        <a routerLink="/productos" (click)="onNavigate()">
          <button routerLinkActive="bg-gradient-to-tr from-blue-600 to-blue-400 shadow-md shadow-blue-500/20"
            class="middle none font-sans font-bold center transition-all disabled:opacity-50 disabled:shadow-none disabled:pointer-events-none text-xs py-3 rounded-lg text-white hover:bg-white/10 active:bg-white/30 w-full flex items-center gap-4 px-4 capitalize"
            type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
              class="w-5 h-5 text-inherit">
              <!-- Fork -->
              <path d="M7 2v7M9 2v7M11 2v7M9 9v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <!-- Knife -->
              <path d="M16 2c1.5 3 1.5 6 0 9v11" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>

            <p class="block antialiased font-sans text-base leading-relaxed text-inherit font-medium capitalize">
              Productos
            </p>
          </button>
        </a>
      </li>
    </ul>

    <div class="shrink-0 border-t border-white/20 pt-4">
      <p class="mb-3 truncate px-1 text-xs text-white/70">
        {{ authService.getUserEmail() }}
      </p>
      <button
        type="button"
        class="flex w-full items-center justify-center rounded-lg border border-white/20 py-3 text-sm font-medium text-white transition hover:bg-white/10 active:bg-white/20"
        (click)="logout()"
      >
        Cerrar sesión
      </button>
    </div>
  </div>
</aside>
