<div
  *ngIf="open"
  class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="sale-form-title"
>
  <div class="bg-white rounded-xl shadow-lg w-full max-w-md">
    <div
      class="px-6 py-4 border-b border-gray-200 flex items-center justify-between"
    >
      <h3 id="sale-form-title" class="text-lg font-semibold text-gray-800">
        {{ title }}
      </h3>
      <button
        type="button"
        class="text-gray-400 hover:text-gray-600 text-xl leading-none"
        aria-label="Cerrar"
        (click)="onCancel()"
      >
        ×
      </button>
    </div>

    <form class="p-6 space-y-4" (ngSubmit)="onSubmit()" #saleForm="ngForm">
      @if (mode === 'table') {
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Número de mesa
          </label>
          <input
            type="number"
            [(ngModel)]="sale.tableNumber"
            name="tableNumber"
            min="1"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>
      } @else {
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Apodo del cliente
          </label>
          <input
            type="text"
            [(ngModel)]="sale.customerNickname"
            name="customerNickname"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Ej: Juan"
            required
          />
        </div>
      }

      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          class="px-4 py-2 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50"
          (click)="onCancel()"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="saleForm.invalid"
          class="px-4 py-2 rounded-md bg-green-500 text-white hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
