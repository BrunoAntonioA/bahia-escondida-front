<header
  class="lg:hidden sticky top-0 z-30 -mx-4 px-4 py-3 mb-2 bg-white/90 backdrop-blur border-b border-gray-200 shadow-sm"
>
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 active:bg-gray-100"
      aria-label="Abrir menú"
      (click)="menuClick.emit()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="h-6 w-6"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
    </button>

    <div class="min-w-0 flex-1">
      <p
        class="text-lg font-semibold text-gray-800 truncate"
        [title]="authService.getClientName() || 'Mi negocio'"
      >
        {{ authService.getClientName() || 'Mi negocio' }}
      </p>
      <p class="text-xs text-gray-500 truncate sm:hidden">
        {{ authService.getUserEmail() }}
      </p>
    </div>
  </div>
</header>
