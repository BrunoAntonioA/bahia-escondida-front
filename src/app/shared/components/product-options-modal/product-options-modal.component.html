<div
  *ngIf="open"
  class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="product-options-title"
>
  <div class="bg-white rounded-xl shadow-lg w-full max-w-lg">
    <div
      class="px-6 py-4 border-b border-gray-200 flex items-center justify-between"
    >
      <div>
        <h3 id="product-options-title" class="text-lg font-semibold text-gray-800">
          Agregar opciones
        </h3>
        <p class="text-sm text-gray-500 mt-0.5">{{ productName }}</p>
      </div>
      <button
        type="button"
        class="text-gray-400 hover:text-gray-600 text-xl leading-none"
        aria-label="Cerrar"
        (click)="onCancel()"
      >
        ×
      </button>
    </div>

    <form class="p-6 space-y-4" (ngSubmit)="onSubmit()" #optionsForm="ngForm">
      <p class="text-sm text-gray-600">
        Agrega las opciones que el cliente podrá elegir más adelante.
      </p>

      <div class="space-y-3">
        <div
          *ngFor="let option of draftOptions; let i = index"
          class="grid grid-cols-1 sm:grid-cols-[1fr_120px_auto] gap-3 items-end"
        >
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Nombre
            </label>
            <input
              type="text"
              [(ngModel)]="option.name"
              [name]="'optionName' + i"
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Ej: ensalada rusa"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Precio
            </label>
            <input
              type="number"
              [(ngModel)]="option.price"
              [name]="'optionPrice' + i"
              min="0"
              step="1"
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <button
            type="button"
            class="h-10 px-3 rounded-md border border-gray-300 text-gray-600 hover:bg-gray-50"
            (click)="removeRow(i)"
            aria-label="Quitar fila"
          >
            −
          </button>
        </div>
      </div>

      <button
        type="button"
        class="inline-flex items-center gap-2 text-sm font-medium text-blue-600 hover:text-blue-800"
        (click)="addRow()"
      >
        <span class="text-lg leading-none">+</span>
        Agregar otra opción
      </button>

      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          class="px-4 py-2 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50"
          (click)="onCancel()"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="!canSubmit || saving"
          class="px-4 py-2 rounded-md bg-blue-500 text-white hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ saving ? 'Guardando...' : 'Guardar opciones' }}
        </button>
      </div>
    </form>
  </div>
</div>
