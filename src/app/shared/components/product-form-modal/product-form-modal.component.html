<div
  *ngIf="open"
  class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="product-form-title"
>
  <div
    class="bg-white rounded-xl shadow-lg w-full max-w-lg max-h-[90vh] overflow-y-auto"
  >
    <div
      class="px-6 py-4 border-b border-gray-200 flex items-center justify-between sticky top-0 bg-white z-10"
    >
      <div>
        <h3 id="product-form-title" class="text-lg font-semibold text-gray-800">
          Nuevo producto
        </h3>
        <p class="text-sm text-gray-500 mt-0.5">
          Puedes agregar opciones ahora o más tarde
        </p>
      </div>
      <button
        type="button"
        class="text-gray-400 hover:text-gray-600 text-xl leading-none"
        aria-label="Cerrar"
        (click)="onCancel()"
      >
        ×
      </button>
    </div>

    <form class="p-6 space-y-5" (ngSubmit)="onSubmit()" #productForm="ngForm">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Nombre
        </label>
        <input
          type="text"
          [(ngModel)]="product.name"
          name="name"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ej: Promo estandar"
          required
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Categoría
        </label>
        <select
          [(ngModel)]="product.category"
          name="category"
          class="w-full border border-gray-300 rounded-md px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        >
          <option value="">Seleccione una categoría</option>
          <option *ngFor="let cat of categoryOptions" [value]="cat.value">
            {{ cat.label }}
          </option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Precio base
        </label>
        <input
          type="number"
          [(ngModel)]="product.price"
          name="price"
          min="0"
          step="1"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="8000"
          required
        />
      </div>

      <div class="border-t border-gray-200 pt-5">
        <div class="flex items-center justify-between mb-3">
          <div>
            <h4 class="text-sm font-semibold text-gray-800">Opciones</h4>
            <p class="text-xs text-gray-500 mt-0.5">Opcional</p>
          </div>
          <button
            type="button"
            class="inline-flex items-center gap-1 text-sm font-medium text-blue-600 hover:text-blue-800"
            (click)="addOptionRow()"
          >
            <span class="text-lg leading-none">+</span>
            Agregar opción
          </button>
        </div>

        <div
          *ngIf="draftOptions.length === 0"
          class="rounded-lg border border-dashed border-gray-300 bg-gray-50 px-4 py-6 text-center text-sm text-gray-500"
        >
          Sin opciones por ahora. Usa "Agregar opción" si el producto las necesita.
        </div>

        <div *ngIf="draftOptions.length > 0" class="space-y-3">
          <div
            *ngFor="let option of draftOptions; let i = index"
            class="grid grid-cols-1 sm:grid-cols-[1fr_120px_auto] gap-3 items-end"
          >
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Nombre
              </label>
              <input
                type="text"
                [(ngModel)]="option.name"
                [name]="'createOptionName' + i"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Ej: ensalada rusa"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Precio
              </label>
              <input
                type="number"
                [(ngModel)]="option.price"
                [name]="'createOptionPrice' + i"
                min="0"
                step="1"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <button
              type="button"
              class="h-10 px-3 rounded-md border border-gray-300 text-gray-600 hover:bg-gray-50"
              (click)="removeOptionRow(i)"
              aria-label="Quitar opción"
            >
              −
            </button>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          class="px-4 py-2 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50"
          (click)="onCancel()"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="productForm.invalid || saving"
          class="px-4 py-2 rounded-md bg-green-500 text-white hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ saving ? 'Guardando...' : 'Guardar producto' }}
        </button>
      </div>
    </form>
  </div>
</div>
