<div class="min-h-screen bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="px-8 py-6 bg-gray-50 border-b border-gray-200">
      <h1 class="text-2xl font-semibold text-gray-800">Bahia escondida</h1>
      <p class="text-sm text-gray-600 mt-1">Inicia sesión para continuar</p>
    </div>

    <form class="p-8 space-y-5" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="email">
          Email
        </label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div>
        <label
          class="block text-sm font-medium text-gray-700 mb-1"
          for="password"
        >
          Contraseña
        </label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="••••••••"
          required
        />
      </div>

      @if (errorMessage) {
        <p class="text-sm text-red-600 bg-red-50 border border-red-100 rounded-md px-3 py-2">
          {{ errorMessage }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid || loading"
        class="w-full bg-green-500 text-white py-2.5 rounded-md hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed transition"
      >
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
